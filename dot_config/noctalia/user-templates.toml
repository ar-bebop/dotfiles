[config]

[templates]

# User-defined templates
# Add your custom templates below
# Example:
# [templates.myapp]
# input_path = "~/.config/noctalia/templates/myapp.css"
# output_path = "~/.config/myapp/theme.css"
# post_hook = "myapp --reload-theme"

[templates.nvim-base16]
input_path = "~/.config/noctalia/templates/nvim.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = 'pkill -SIGUSR1 nvim'

[templates.foot-sequences]
input_path = "~/.config/noctalia/templates/foot-sequences.sh"
output_path = "~/.cache/noctalia/foot-sequences.sh"
post_hook = 'bash ~/.cache/noctalia/foot-sequences.sh'
