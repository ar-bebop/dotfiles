# Status line on the terminal's ANSI palette (colour0-15, themed by matugen).
# Dither edges take the block's colour, dense end towards it: ░▒▓ block ▓▒░.

# Palette: role -> ANSI slot
set -g @sl_bg        colour0    # bar background
set -g @sl_fg        colour3    # dim text, inactive windows
set -g @sl_accent    colour2    # session block, host
set -g @sl_accent_fg colour0    # text on accent
set -g @sl_alert     colour1    # prefix held
set -g @sl_block     colour3    # active window, clock
set -g @sl_block_fg  colour0    # text on blocks
set -g @sl_mode      colour4    # copy-mode pill
set -g @sl_mode_fg   colour0    # text on the pill
set -g @sl_wait      colour1    # agent stopped, not seen yet
set -g @sl_run       colour3    # agent working
set -g @sl_seen      colour2    # agent stopped, seen

# Glyphs
set -g @sl_sesh_on   "┃"        # current session
set -g @sl_sesh_off  "┊"        # other sessions
set -g @sl_agent     "■"        # one per agent, after its session's bar

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=#{@sl_bg},fg=#{@sl_fg}"

# Left: session name (alert colour while the prefix is held), then one bar per
# session followed by its agent marks (@agent_dots, written by scripts/agent-dots).
set -g @sl_head    "#{?client_prefix,#{@sl_alert},#{@sl_accent}}"
set -g @sl_session "#[fg=#{@sl_accent_fg},bg=#{E:@sl_head},bold] #S #[fg=#{E:@sl_head},bg=#{@sl_bg},nobold]▓▒░ "
set -g @sl_bar     "#{?#{==:#{session_name},#{client_session}},#[fg=#{@sl_accent}]#{@sl_sesh_on},#[fg=#{@sl_fg}]#{@sl_sesh_off}}"
set -g @sl_marks   "#{?@agent_dots,#{E:@agent_dots} ,}"
set -g status-left-length 60
set -g status-left "#{E:@sl_session}#{S:#{E:@sl_bar}#{E:@sl_marks}}#[default] "

# Windows: inactive in dim text (@sl_wait while an agent in it waits for you);
# current in a boxed block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{?@agent-radar-window-stopped,#{@sl_wait},#{@sl_fg}},bg=#{@sl_bg}] #I #W "
set -g window-status-current-format "#[fg=#{@sl_block},bg=#{@sl_bg}]░▒▓#[fg=#{@sl_block_fg},bg=#{@sl_block},bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#{@sl_block},bg=#{@sl_bg},nobold]▓▒░"

# Right: copy-mode pill, clock, host. @sl_agents prints nothing; it refreshes
# the agent marks every status-interval.
set -g @sl_agents "#(~/.config/tmux/scripts/agent-dots '#{session_name}')"
set -g @sl_copy   "#{?pane_in_mode,#[fg=#{@sl_mode}#,bg=#{@sl_bg}]░▒▓#[fg=#{@sl_mode_fg}#,bg=#{@sl_mode}#,bold] COPY #[fg=#{@sl_mode}#,bg=#{@sl_bg}#,nobold]▓▒░ ,}"
set -g @sl_clock  "#[fg=#{@sl_block},bg=#{@sl_bg}]░▒▓#[fg=#{@sl_block_fg},bg=#{@sl_block}] %H:%M %Y-%m-%d "
set -g @sl_host   "#[fg=#{@sl_accent},bg=#{@sl_block}]░▒▓#[fg=#{@sl_accent_fg},bg=#{@sl_accent},bold] #(whoami)@#h "
set -g status-right-length 60
set -g status-right "#{E:@sl_agents}#{E:@sl_copy}#{E:@sl_clock}#{E:@sl_host}"
