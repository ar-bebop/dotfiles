# ── Statusline ────────────────────────────────────────────────────
# base16-style bar, hand-rolled. Every colour0–15 is an ANSI palette
# slot set by matugen, so this re-themes with foot/ghostty automatically
# (same approach as ansi-nvim + yazi's base16 flavor). No hex, no 256-cube.
#
# Dither separators (░▒▓ / ▓▒░) follow one rule:
#   fg = the solid block's color, bg = whatever's on the other side,
#   dense end points at the block → block on the RIGHT uses ░▒▓,
#   block on the LEFT uses ▓▒░.

# ── Palette (role → ANSI slot) ────────────────────────────────────
# Change a slot here and every component with that role follows. The
# colour0–15 names are themed by matugen; these just give them meaning.
# Namespaced @sl_* so they can't clash with plugin options. Looked up at
# render time, so order vs the options below doesn't matter.
set -g @sl_bg        colour0    # bar background
set -g @sl_fg        colour3    # default / dim text (inactive windows)
set -g @sl_accent    colour2    # accent bookends: session block + host
set -g @sl_accent_fg colour0    # text on accent blocks
set -g @sl_alert     colour1    # prefix-held indicator
set -g @sl_block     colour3    # neutral blocks: active window + clock
set -g @sl_block_fg  colour0    # text on neutral blocks
set -g @sl_mode      colour4    # copy-mode pill
set -g @sl_mode_fg   colour0    # text on copy-mode pill

# Session indicator (left sector): one vertical bar per session, "bars" style.
# Active bar uses @sl_accent, the rest @sl_fg (dim). Swap the glyphs to restyle
# (e.g. ● / ○ for dots, ◆ / ◇ for diamonds).
set -g @sl_sesh_on  "┃"   # current session  (solid heavy bar)
set -g @sl_sesh_off "┊"   # other sessions   (dotted bar, U+250A)

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=#{@sl_bg},fg=#{@sl_fg}"

# Left: session block (turns @sl_alert while the prefix is held → prefix
# indicator), then a per-session bar meter — one bar per session, current
# session heavy + @sl_accent, the rest light + dim. The #{S:...} loop walks
# every session; #{client_session} is the one this client is viewing.
set -g status-left-length 60
set -g status-left "#[fg=#{@sl_accent_fg},bg=#{?client_prefix,#{@sl_alert},#{@sl_accent}},bold] #S #[fg=#{?client_prefix,#{@sl_alert},#{@sl_accent}},bg=#{@sl_bg},nobold]▓▒░ #{S:#{?#{==:#{session_name},#{client_session}},#[fg=#{@sl_accent}]#{@sl_sesh_on},#[fg=#{@sl_fg}]#{@sl_sesh_off}}}#[default] "

# Windows: inactive = plain text; current = boxed @sl_block with dither edges.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@sl_fg},bg=#{@sl_bg}] #I #W "
set -g window-status-current-format "#[fg=#{@sl_block},bg=#{@sl_bg}]░▒▓#[fg=#{@sl_block_fg},bg=#{@sl_block},bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#{@sl_block},bg=#{@sl_bg},nobold]▓▒░"

# Right: COPY pill (only in copy-mode) + clock + host bookend.
set -g status-right-length 60
set -g status-right "#{?pane_in_mode,#[fg=#{@sl_mode}#,bg=#{@sl_bg}]░▒▓#[fg=#{@sl_mode_fg}#,bg=#{@sl_mode}#,bold] COPY #[fg=#{@sl_mode}#,bg=#{@sl_bg}#,nobold]▓▒░ ,}#[fg=#{@sl_block},bg=#{@sl_bg}]░▒▓#[fg=#{@sl_block_fg},bg=#{@sl_block}] %H:%M %Y-%m-%d #[fg=#{@sl_accent},bg=#{@sl_block}]░▒▓#[fg=#{@sl_accent_fg},bg=#{@sl_accent},bold] #(whoami)@#H "
