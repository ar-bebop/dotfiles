# ── Statusline ────────────────────────────────────────────────────
# base16-style bar, hand-rolled. Every colour0–15 is an ANSI palette
# slot set by matugen, so this re-themes with foot/ghostty automatically
# (same approach as ansi-nvim + yazi's base16 flavor). No hex, no 256-cube.
#
# Dither separators (░▒▓ / ▓▒░) follow one rule:
#   fg = the solid block's color, bg = whatever's on the other side,
#   dense end points at the block → block on the RIGHT uses ░▒▓,
#   block on the LEFT uses ▓▒░.

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour0,fg=colour7"

# Left: session block. Turns red (colour1) while the prefix is held
#   → prefix / "Prompt" indicator.
set -g status-left-length 40
set -g status-left "#[fg=colour0,bg=#{?client_prefix,colour1,colour4},bold] #S #[fg=#{?client_prefix,colour1,colour4},bg=colour0,nobold]▓▒░ "

# Windows: inactive = plain text; current = boxed gray block with dither edges.
set -g window-status-separator ""
set -g window-status-format "#[fg=colour7,bg=colour0] #I #W "
set -g window-status-current-format "#[fg=colour8,bg=colour0]░▒▓#[fg=colour15,bg=colour8,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=colour8,bg=colour0,nobold]▓▒░"

# Right: COPY pill (only in copy-mode) + clock + host bookend.
set -g status-right-length 60
set -g status-right "#{?pane_in_mode,#[fg=colour3#,bg=colour0]░▒▓#[fg=colour0#,bg=colour3#,bold] COPY #[fg=colour3#,bg=colour0#,nobold]▓▒░ ,}#[fg=colour8,bg=colour0]░▒▓#[fg=colour15,bg=colour8] %a %d %b  %H:%M #[fg=colour4,bg=colour8]░▒▓#[fg=colour0,bg=colour4,bold] #H "
