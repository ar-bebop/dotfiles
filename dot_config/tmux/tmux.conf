# ── Plugins (managed by tpm) ──────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'jaclu/tmux-menus'

# ── Truecolor ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"          # the line that actually enables 24-bit color

# ── Extended keys + passthrough (TUI agents: Claude Code / herdr) ──
set -s extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on

# ── Mouse + clipboard ─────────────────────────────────────────────
set -g mouse on
set -g set-clipboard on                     # programs in panes can set the clipboard via OSC 52

# ── Vi everywhere ─────────────────────────────────────────────────
set -g mode-keys vi                         # copy-mode = vim navigation/selection
set -g status-keys vi                       # prefix+: command prompt = vi editing

# loud mode indicator at the command prompt (insert vs normal)
set -g message-style         "bg=green,fg=black"   # insert mode
set -g message-command-style "bg=red,fg=white"     # normal mode

# vim-style selection (y → system clipboard is provided by tmux-yank)
bind -T copy-mode-vi v send -X begin-selection

# ── Plugin options ────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'   # restore what was on screen
set -g @resurrect-dir '~/.local/share/tmux/resurrect'  # keep saves in XDG data dir, not ~/.tmux
set -g @continuum-restore 'on'                 # auto-restore sessions on tmux start

set -g @sessionx-bind 'O'                       # prefix + O opens the session picker
set -g @sessionx-zoxide-mode 'on'               # include zoxide dirs in the picker
set -g detach-on-destroy off                    # (sessionx) jump back to picker, don't detach

set -g @menus_trigger 'Space'                   # prefix + Space opens the menus (overrides next-layout)
set -g @menus_config_file '~/.config/tmux/tmux.conf'  # path the menu's "Reload config" item sources

# ── Statusline (kept in its own file) ─────────────────────────────
source-file '~/.config/tmux/statusline.conf'

# ── prefix (default C-b; uncomment to remap to C-a) ───────────────
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ── tpm bootstrap — MUST be the last line ─────────────────────────
run '~/.config/tmux/plugins/tpm/tpm'
