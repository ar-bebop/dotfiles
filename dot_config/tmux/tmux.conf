# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'vieitesss/agent-radar'

# Options
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:extkeys"
set -s extended-keys on
set -g allow-passthrough on
set -g mouse on
set -g set-clipboard on
set -g mode-keys vi
set -g display-time 2000
set -g set-titles on
set -g base-index 1
set -g detach-on-destroy off

# Refresh only per-connection vars on attach; the stock list deletes the agent
# and display vars after an ssh attach, and this machine's are always right.
set -g update-environment "KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# tmux-persist: save each session on detach/close, restore it on create
set -g @persist-dir '~/.local/share/tmux/resurrect'
set -g @persist-processes 'claude codex'
set -g @persist-max-snapshots 50  # default 0 (unlimited) made every save slow
set -g @persist-delete-backup-after 30  # days; shorter loses sessions after time away

# Save every 60 s; the flag stops a re-source from starting a second loop
%if "#{==:#{@autosave_started},}"
set -g @autosave_started 1
run-shell -b '~/.config/tmux/scripts/autosave 60'
%endif

# Hooks: copy the desktop's display vars on attach, refresh the agent marks on session switch
set-hook -g client-attached { run-shell -b '~/.config/tmux/scripts/env-refresh' }
set-hook -g client-session-changed[20] { run-shell -b '~/.config/tmux/scripts/agent-dots "#{session_name}"' }

# sessionx
set -g @sessionx-bind 'O'
set -g @sessionx-zoxide-mode 'on'

# menus
set -g @menus_trigger 'Space'
set -g @menus_config_file '~/.config/tmux/tmux.conf'

# smooth-scroll
set -g @smooth-scroll-speed "100"  # 0-1000, lower is faster
set -g @smooth-scroll-easing "sine"  # linear, sine or quad
set -g @smooth-scroll-normal "3"  # lines per scroll step
set -g @smooth-scroll-halfpage ""  # default: pane_height / 2
set -g @smooth-scroll-fullpage ""  # default: pane_height
set -g @smooth-scroll-mouse "true"
set -g @smooth-scroll-exit-copy-mode-at-bottom "true"

# tmux-window-name
set -g @tmux_window_name_shells "['bash', 'fish', 'sh', 'zsh']"
set -g @tmux_window_name_dir_programs "['nvim', 'vim', 'vi', 'git', 'claude', 'yazi']"
set -g @tmux_window_name_use_tilde "True"
set -g @tmux_window_name_show_program_args "False"
set -g @tmux_window_name_icon_style "'name_and_icon'"
set -g @tmux_window_name_custom_icons "{'claude': '✳', 'yazi': '󰇥'}"

# agent-radar
set -g @agent-radar-glance off
set -g @agent-radar-notify off
set -g @agent-radar-working-pattern "\342[\240-\243]|^(·|✢|✳|✶|✻|✽|[*]) [[:alpha:]][^(]*… [(]|^  ◯ "
set -g @agent-radar-key g

# Status line
source-file ~/.config/tmux/statusline.conf

# Binds
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind -T copy-mode-vi v send -X begin-selection
bind a last-window
bind Tab switch-client -l
bind G run-shell '~/.config/tmux/scripts/agent-next'

# TPM: install on first start, then load the plugins (keep last)
run-shell '[ -d ~/.config/tmux/plugins/tpm ] || git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'
run-shell '~/.config/tmux/plugins/tpm/tpm'
