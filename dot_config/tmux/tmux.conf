# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'hiroppy/tmux-agent-sidebar'

# options
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s extended-keys on
set -g allow-passthrough on
set -as terminal-features ",*:extkeys"
set -g mouse on
set -g set-clipboard on
set -g mode-keys vi
set -g display-time 2000
set -g set-titles on
set -g base-index 1
set -g detach-on-destroy off

# Attaching must not mutate a session that already has the environment right.
# The stock update-environment list makes tmux *delete* vars the attaching client
# lacks -- ssh/mosh have no agent and no display, so every pane created after a
# remote attach loses SSH_AUTH_SOCK (breaking commit signing and git-over-ssh)
# and DISPLAY/WAYLAND_DISPLAY. This machine's agent and compositor are always the
# correct ones, so keep them and only refresh genuinely per-connection vars.
set -g update-environment "KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# tmux-persist: saves per-session on detach/close + restores on session create.
set -g @persist-dir '~/.local/share/tmux/resurrect'
set -g @persist-processes 'claude codex'

# Retention. @persist-max-snapshots defaults to 0 = UNLIMITED, and the only
# active limit was the 7-day age rule -- which left 1457 snapshots / 171 MB on
# lain. That is not just disk: the prune loop shells out to find(1) once per
# retained snapshot on EVERY save (measured 1462 spawns in a single save), so
# an uncapped directory made each save cost 0.80 s instead of ~0.05 s, and the
# cost grew with save frequency. Capping the count fixes both.
set -g @persist-max-snapshots 50
# With the count capped, disk is bounded regardless of age, so this window
# should be GENEROUS rather than tight: at the 7-day default, two weeks away
# from a machine ages out every snapshot and drops the session's _last pointer
# with it, losing the session entirely.
set -g @persist-delete-backup-after 30

# Periodic save, replacing the tmux-save.service/.timer pair. Guarded so that
# re-sourcing this file (prefix + r) does not start a second loop -- verified
# to still be exactly one loop after three reloads.
if-shell '[ -z "#{@autosave_started}" ]' \
  'set -g @autosave_started 1 ; run-shell -b "$HOME/.local/bin/tmux-autosave 60"'

# Push the live Wayland/niri env into the server whenever a client attaches,
# replacing tmux-env.service. Better than the unit it replaces: that fired once
# per graphical-session activation, while this fires on every attach and so
# also catches niri socket churn from a later relogin. No-ops off Wayland.

# sessionx
set -g @sessionx-bind 'O'
set -g @sessionx-zoxide-mode 'on'

# menus
set -g @menus_trigger 'Space'
set -g @menus_config_file '~/.config/tmux/tmux.conf'

set-hook -g client-attached 'run-shell -b "$HOME/.local/bin/tmux-env-refresh"'

# smooth-scroll
set -g @smooth-scroll-speed "100" # Speed: 0-1000 | lower = faster
set -g @smooth-scroll-easing "sine" # Easing mode: linear|sine|quad
set -g @smooth-scroll-normal "3" # Scroll line distance
set -g @smooth-scroll-halfpage ""  # Default: pane_height / 2
set -g @smooth-scroll-fullpage ""  # Default: pane_height
set -g @smooth-scroll-mouse "true"
set -g @smooth-scroll-exit-copy-mode-at-bottom "true"

# tmux-window-name
set -g @tmux_window_name_shells "['bash', 'fish', 'sh', 'zsh']"
set -g @tmux_window_name_dir_programs "['nvim', 'vim', 'vi', 'git', 'claude', 'yazi']"
set -g @tmux_window_name_use_tilde "True"
set -g @tmux_window_name_show_program_args "False"
set -g @tmux_window_name_icon_style "'name_and_icon'"
set -g @tmux_window_name_custom_icons "{'claude': '✳', 'yazi': '󰇥'}"

# tmux-window-name
set -g @sidebar_pet on
set -g @sidebar_auto_create off

# statusline
source-file ~/.config/tmux/statusline.conf

#binds
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind -T copy-mode-vi v send -X begin-selection

# LEAVE THIS LAST DO NOT TOUCH
if-shell 'test ! -d "$HOME/.config/tmux/plugins/tpm"' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm"'

run "$HOME/.config/tmux/plugins/tpm/tpm"
