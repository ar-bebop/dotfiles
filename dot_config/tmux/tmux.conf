# Plugins (managed by tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'azorng/tmux-smooth-scroll'

# Truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Extended keys + passthrough (TUI agents: Claude Code / herdr)
set -s extended-keys on
set -g allow-passthrough on
set -as terminal-features ",*:extkeys"

# Mouse + clipboard
set -g mouse on
set -g set-clipboard on

# Vi everywhere
set -g mode-keys vi

# Other
set -g display-time 2000
set -g set-titles on
set -g base-index 1
set -g detach-on-destroy off

# vim-style selection
bind -T copy-mode-vi v send -X begin-selection

# Plugin options
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

set -g @sessionx-bind 'O'
set -g @sessionx-zoxide-mode 'on'

set -g @menus_trigger 'Space'
set -g @menus_config_file '~/.config/tmux/tmux.conf'

# Speed: 0-1000 | lower = faster
set -g @smooth-scroll-speed "100"

# Easing mode: linear|sine|quad
set -g @smooth-scroll-easing "sine"

# Scroll line distance
set -g @smooth-scroll-normal "3"
set -g @smooth-scroll-halfpage ""  # Default: pane_height / 2
set -g @smooth-scroll-fullpage ""  # Default: pane_height

# Enable on mouse wheel scroll
set -g @smooth-scroll-mouse "true"

# Auto-exit copy mode when scrolling past the bottom
set -g @smooth-scroll-exit-copy-mode-at-bottom "true"

# Statusline
source-file ~/.config/tmux/statusline.conf

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# LEAVE THIS LAST DO NOT TOUCH
if-shell 'test ! -d "$HOME/.config/tmux/plugins/tpm"' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm"'

run "$HOME/.config/tmux/plugins/tpm/tpm"
