XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache

# Marker: proves this environment.d was inherited. ssh/PAM logins never read the
# systemd user environment, so its absence tells fish to bridge these vars in.
ENVIRONMENT_D=1
